<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-semibold" id="confirmDeleteModalLabel" data-i18n="confirm.delete.title">Confirm delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-2">
                <p class="mb-0 text-muted" id="confirmDeleteMessage" data-i18n="confirm.delete.message">
                    Are you sure you want to delete this item? This action cannot be undone.
                </p>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="confirmDeleteCancel" data-i18n="confirm.delete.cancel">
                    Cancel
                </button>
                <button type="button" class="btn btn-danger" id="confirmDeleteConfirm" data-i18n="confirm.delete.confirm">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>
