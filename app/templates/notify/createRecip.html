<div class="modal fade" id="createRecipModal" tabindex="-1" aria-labelledby="createRecipModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-semibold" id="createRecipModalLabel" data-i18n="notify.create.title">Add Recipient</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-2">
                <form id="createRecipForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="createRecipUsername" data-i18n="notify.form.username">Name</label>
                        <input type="text" class="form-control form-control-lg" id="createRecipUsername" required>
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="createRecipIsStaff">
                        <label class="form-check-label" for="createRecipIsStaff" data-i18n="notify.form.staff">Staff recipient</label>
                    </div>
                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="createRecipIsActive" checked>
                        <label class="form-check-label" for="createRecipIsActive" data-i18n="notify.form.active">Active recipient</label>
                    </div>
                    <div class="d-grid d-md-flex justify-content-md-end gap-2">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="notify.form.cancel">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="createRecipSubmit" data-i18n="notify.create.submit">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
